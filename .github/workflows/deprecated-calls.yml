name: Source gates

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gates over src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # The gate is tested before it is trusted. If this step fails the scan
      # below means nothing, whatever it reports.
      - name: Test the gate
        run: php tools/tests/test-no-deprecated-calls.php

      - name: Scan src for unguarded deprecated calls
        run: php tools/no-deprecated-calls.php src

      # The rule that decides what an area or an action may carry. Three of its
      # cases sit one byte from a rule that looks identical and is wrong, and
      # none of the three fails loudly in production: the token stops arriving,
      # the beacon still answers 202, and nothing records that anything was
      # dropped.
      - name: Test the surface token rule
        run: php tools/tests/test-surface-token.php

      # The library calls back into the host's helper, and composer cannot hold
      # that pairing: the module requires a minimum library version, a library
      # cannot require a minimum module version, and the module's constraint is
      # a floor with no ceiling. An unguarded call is therefore a fatal on
      # every installation whose module predates the method -- on the answer
      # and on the failure alike.
      - name: Test that the host is notified only when it can be
        run: php tools/tests/test-notification-guard.php
